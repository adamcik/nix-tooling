name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      make-space:
        description: Exercise disk cleanup before installing Nix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./actions/nix-setup
        with:
          make-space: ${{ inputs.make-space || 'false' }}
      - name: Check Nix installation
        run: nix --version
      - name: Run flake checks
        run: nix flake check --print-build-logs
