name: Set up Nix
description: Install Nix on GitHub-hosted x86_64 Ubuntu runners, with optional disk cleanup.

inputs:
  github-token:
    description: Token for Nix fetches from github.com; falls back to the job token when omitted.
    required: false
  make-space:
    description: Remove preinstalled tools and expand /nix before installation (true or false).
    required: false
    default: "false"
  trust-runner-user:
    description: Add the runner user to Nix trusted-users (true or false).
    required: false
    default: "true"
  extra-conf:
    description: Additional configuration appended to /etc/nix/nix.conf.
    required: false

runs:
  using: composite
  steps:
    - name: Validate setup
      shell: bash
      env:
        MAKE_SPACE: ${{ inputs.make-space }}
        TRUST_RUNNER_USER: ${{ inputs.trust-runner-user }}
      run: |
        if [[ "$RUNNER_ENVIRONMENT" != github-hosted || "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
          echo "::error::nix-setup supports GitHub-hosted x86_64 Ubuntu runners only."
          exit 1
        fi
        for input in MAKE_SPACE TRUST_RUNNER_USER; do
          case "${!input}" in
            true|false) ;;
            *)
              echo "::error::$input must be true or false."
              exit 1
              ;;
          esac
        done

    - name: Make space for Nix
      if: inputs.make-space == 'true'
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: cleave
        # Finish removing runner tools before the installer or later steps use them.
        witness-carnage: "true"

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.github-token }}
        set_as_trusted_user: ${{ inputs.trust-runner-user }}
        extra_nix_config: ${{ inputs.extra-conf }}
