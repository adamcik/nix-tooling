name: Verify Actions dependency lockfile
description: Install the pinned gh-actions-lock extension and verify the checked-out repository's actions.lock.

inputs:
  github-token:
    description: Token for reading action repositories; defaults to the caller's job token.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install and verify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ACTIONS_LOCK_VERSION: v0.4.1 # renovate: datasource=github-releases depName=github/gh-actions-lock
      run: |
        gh extension install github/gh-actions-lock --pin "$ACTIONS_LOCK_VERSION" --force
        gh actions-lock --verify
